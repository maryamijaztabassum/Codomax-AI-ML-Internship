<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AI Resume Analyzer</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<main class="container">
<header>
<div class="badge">AI + ML FINAL PROJECT</div>
<h1>AI Resume Analyzer</h1>
<p>Compare your resume with a job description using Google Gemini AI.</p>
</header>
<section class="card">
<label>Your Resume / Skills</label>
<textarea id="resume" placeholder="Paste your resume, education, skills, projects and experience..."></textarea>
<label>Job Description</label>
<textarea id="job" placeholder="Paste the job description here..."></textarea>
<button id="analyzeBtn" onclick="analyzeResume()">Analyze with AI</button>
<div id="status"></div>
<section id="resultBox" class="result hidden">
<div class="result-head"><h2>AI Analysis</h2><button class="copy" onclick="copyResult()">Copy</button></div>
<pre id="result"></pre>
</section>
</section>
<footer>Built as a Final AI & ML Project</footer>
</main>
<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
